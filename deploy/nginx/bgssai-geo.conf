# Nginx 通配子域名静态路由与 8080 反代配置（bgssai-geo）
# 支持数百个子域名 *.bgssai-geo.com / *.bgss-geo.com / *.bgssai-geo.cn 直接映射到对应子站点

server {
    listen 80;
    server_name bgssai-geo.com www.bgssai-geo.com *.bgssai-geo.com bgss-geo.com *.bgss-geo.com bgssai-geo.cn *.bgssai-geo.cn;

    location /bgssai/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
