# Nginx 通配子域名静态路由与 8080 反代配置（bgssai-geo）
# 汇集昆山兵贵神速智能科技有限公司名下全部备案域名与 GEO 域名下的数百个子域名

server {
    listen 80;
    server_name
        bgssai-geo.cn *.bgssai-geo.cn
        bgssai-geo.com *.bgssai-geo.com
        bgss-geo.com *.bgss-geo.com
        bgssaigeo.com *.bgssaigeo.com
        *.bgssai.com *.bgssai.cn
        *.bgssai-blog.com *.bgssai-marklens.com *.bgssai-publish.com
        *.bgssai-magic.com *.bgssai-voiceunion.com *.bgssai-wiki.com
        *.bgssai-hr.com *.bgssai-chat.cn *.bgssai-saas.cn
        *.bgssai-tokenhub.cn *.bgssai-financial.com *.bgssai-note.com
        *.bgssai-short.com *.bgssai-web.com;

    location /bgssai/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
